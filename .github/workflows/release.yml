name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller pymobiledevice3 readchar inquirer3 customtkinter

      - name: Verify pymobiledevice3 metadata
        run: |
          python -c "import importlib.metadata as m; print(m.version('pymobiledevice3'))"

      - name: Read version
        id: version
        run: echo "version=$(python3 -c 'from version import __version__; print(__version__)')" >> "$GITHUB_OUTPUT"

      # ── CLI ────────────────────────────────────────────────────────────────
      - name: Build ifly CLI
        run: |
          python -m PyInstaller ifly.spec --noconfirm

      - name: Sign and package CLI
        run: |
          codesign --force --deep --sign - dist/ifly
          cd dist
          zip "ifly-${{ steps.version.outputs.version }}-macos.zip" ifly

      # ── GUI ────────────────────────────────────────────────────────────────
      - name: Build GUI app
        run: |
          python -m PyInstaller iOS虛擬定位.spec --noconfirm

      - name: Package GUI
        run: |
          cd dist
          zip -r "iOS虛擬定位-${{ steps.version.outputs.version }}-macos.zip" iOS虛擬定位.app/

      # ── Release ────────────────────────────────────────────────────────────
      - name: Extract changelog for this version
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          NOTES=$(awk "/^## v${VERSION}$/{found=1; next} found && /^## /{exit} found{print}" CHANGELOG.md)
          {
            echo "notes<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "v${{ steps.version.outputs.version }}"
          body: |
            ## ifly CLI
            下載 `ifly-*-macos.zip`，解壓後執行：
            ```bash
            # 安裝
            ./ifly install
            # 更新
            ./ifly update
            ```

            ## iOS 虛擬定位（GUI）
            下載 `iOS虛擬定位-*-macos.zip`，解壓後拖入 `/Applications/`。

            ${{ steps.changelog.outputs.notes }}
          files: |
            dist/ifly-${{ steps.version.outputs.version }}-macos.zip
            dist/iOS虛擬定位-${{ steps.version.outputs.version }}-macos.zip
